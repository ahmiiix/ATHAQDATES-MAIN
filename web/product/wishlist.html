<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | ATHAQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Manrope', sans-serif; }
    .glass-effect { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-[#faf9f4] text-[#1b1c19]">

  <!-- Header -->
  <nav class="fixed top-0 w-full z-50 px-8 h-20 flex items-center justify-between border-b border-gray-200 glass-effect">
    <a href="../product/index.html" class="flex items-center gap-2 text-sm font-bold text-[#004232] hover:text-amber-700 transition-colors">
      <i class="fa-solid fa-arrow-left"></i> Back to Shop
    </a>
    <h1 class="text-2xl font-extrabold text-[#004232] tracking-tight">My Wishlist</h1>
    <div class="w-24"></div>
  </nav>

  <main class="max-w-6xl mx-auto pt-32 pb-20 px-6">
    <div id="wishlistContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Items dynamically loaded -->
    </div>

    <!-- Empty State -->
    <div id="emptyMessage" class="hidden flex flex-col items-center justify-center py-24 text-center">
      <div class="w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center mb-6">
        <i class="fa-regular fa-heart text-4xl text-emerald-200"></i>
      </div>
      <h2 class="text-3xl font-extrabold text-[#004232] mb-2">Wishlist is empty</h2>
      <p class="text-gray-500 mb-8 max-w-sm">Looks like you haven't saved any treasures from our harvest yet.</p>
      <a href="../product/index.html" class="bg-[#004232] text-white px-8 py-4 rounded-2xl font-bold hover:bg-[#002e23] transition-all shadow-lg">Explore Harvest</a>
    </div>
  </main>

  <script>
    function renderWishlist() {
      const container = document.getElementById('wishlistContainer');
      const emptyMsg = document.getElementById('emptyMessage');
      const wishlist = JSON.parse(localStorage.getItem('athaqWishlist')) || [];

      if (wishlist.length === 0) {
        container.classList.add('hidden');
        emptyMsg.classList.remove('hidden');
      } else {
        container.classList.remove('hidden');
        emptyMsg.classList.add('hidden');
        container.innerHTML = wishlist.map(item => `
          <div class="group bg-white rounded-3xl p-4 border border-gray-100 shadow-sm hover:shadow-xl transition-all duration-300">
            <div class="relative aspect-square overflow-hidden rounded-2xl mb-4">
              <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <button onclick="removeItem('${item.id}')" class="absolute top-3 right-3 w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-rose-500 hover:bg-rose-500 hover:text-white transition-all shadow-md">
                <i class="fa-solid fa-trash-can text-sm"></i>
              </button>
            </div>
            <div class="px-2 pb-2">
              <h3 class="text-lg font-bold text-[#004232] mb-1">${item.name}</h3>
              <p class="text-xl font-extrabold text-[#004232] mb-4">SAR ${item.price}</p>
              
              <!-- Action Buttons -->
              <div class="flex flex-col gap-2">
                <button onclick="buyNow('${item.id}', '${item.name}', ${item.price}, '${item.image}')" class="w-full bg-[#004232] text-white py-3 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-[#002e23] transition-colors shadow-md">
                  Buy Now
                </button>
                <button onclick="viewProduct()" class="w-full border border-gray-200 py-3 rounded-xl font-bold text-xs uppercase tracking-wider text-gray-600 hover:bg-gray-50 transition-colors">
                  View Product
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function buyNow(id, name, price, image) {
      // Sirf click kiye gaye product ko cart mein set karein (purana data clear ho jayega)
      const singleProductCart = [{
        id: id,
        name: name,
        price: price,
        image: image,
        quantity: 1
      }];

      localStorage.setItem('athaqCart', JSON.stringify(singleProductCart));
      
      // Checkout page par redirect karein
      window.location.href = '/admin/checkout.html';
    }

    function viewProduct() {
      window.location.href = '../product/index.html';
    }

    function removeItem(id) {
      let wishlist = JSON.parse(localStorage.getItem('athaqWishlist')) || [];
      wishlist = wishlist.filter(item => item.id !== id);
      localStorage.setItem('athaqWishlist', JSON.stringify(wishlist));
      renderWishlist();
    }

    renderWishlist();
  </script>
</body>
</html>
