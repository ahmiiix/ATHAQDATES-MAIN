<script>

/* ============================================================
   ATHAQ SUPABASE CONNECTION
============================================================ */

let db = null;


/* ------------------------------------------------------------
   Resolve Supabase Client
------------------------------------------------------------ */

function resolveSupabaseClient() {

  try {

    /* Existing ATHAQ client */
    if (
      window.athaqSupabase &&
      typeof window.athaqSupabase.from === "function"
    ) {
      return window.athaqSupabase;
    }


    /* Existing Supabase client */
    if (
      window.supabaseClient &&
      typeof window.supabaseClient.from === "function"
    ) {
      return window.supabaseClient;
    }


    /* ATHAQ_SUPABASE */
    if (
      window.ATHAQ_SUPABASE &&
      typeof window.ATHAQ_SUPABASE.from === "function"
    ) {
      return window.ATHAQ_SUPABASE;
    }


    /* Generic Supabase client */
    if (
      window.supabaseClient &&
      typeof window.supabaseClient.from === "function"
    ) {
      return window.supabaseClient;
    }


    /* Config variables */
    const url =
      window.SUPABASE_URL ||
      window.supabaseUrl ||
      window.ATHAQ_SUPABASE_URL;


    const key =
      window.SUPABASE_ANON_KEY ||
      window.SUPABASE_KEY ||
      window.supabaseAnonKey ||
      window.ATHAQ_SUPABASE_ANON_KEY;


    if (
      url &&
      key &&
      window.supabase &&
      typeof window.supabase.createClient === "function"
    ) {

      window.athaqSupabase =
        window.supabase.createClient(url, key);

      return window.athaqSupabase;

    }


    /* Sometimes config.js defines lexical variables */
    try {

      if (
        typeof supabaseClient !== "undefined" &&
        supabaseClient &&
        typeof supabaseClient.from === "function"
      ) {
        return supabaseClient;
      }

    } catch (e) {}


  } catch (error) {

    console.error(
      "ATHAQ Supabase resolver error:",
      error
    );

  }


  return null;

}


/* ============================================================
   HELPERS
============================================================ */

const STATUS_STEPS = [

  {
    key: "new",
    label: "Order Received",
    icon: "fa-receipt"
  },

  {
    key: "confirmed",
    label: "Confirmed",
    icon: "fa-circle-check"
  },

  {
    key: "preparing",
    label: "Preparing",
    icon: "fa-box-open"
  },

  {
    key: "out_for_delivery",
    label: "Out for Delivery",
    icon: "fa-truck"
  },

  {
    key: "delivered",
    label: "Delivered",
    icon: "fa-circle-check"
  }

];


function esc(value) {

  const div = document.createElement("div");

  div.textContent = value ?? "";

  return div.innerHTML;

}


/* ============================================================
   STATUS
============================================================ */

function normalizeStatus(status) {

  const value =
    String(status || "new")
      .trim()
      .toLowerCase();


  /* Old status names compatibility */

  if (value === "processing") {
    return "preparing";
  }

  if (value === "shipped") {
    return "out_for_delivery";
  }


  return value;

}


function statusMeta(status) {

  status = normalizeStatus(status);


  const map = {

    new: {
      label: "Order Received",
      cls: "bg-blue-50 text-blue-700 border border-blue-100"
    },

    confirmed: {
      label: "Confirmed",
      cls: "bg-emerald-50 text-emerald-700 border border-emerald-100"
    },

    preparing: {
      label: "Preparing",
      cls: "bg-amber-50 text-amber-700 border border-amber-100"
    },

    out_for_delivery: {
      label: "Out for Delivery",
      cls: "bg-purple-50 text-purple-700 border border-purple-100"
    },

    delivered: {
      label: "Delivered",
      cls: "bg-green-50 text-green-700 border border-green-100"
    },

    cancelled: {
      label: "Cancelled",
      cls: "bg-red-50 text-red-700 border border-red-100"
    }

  };


  return map[status] || map.new;

}


/* ============================================================
   PROGRESS
============================================================ */

function renderProgress(status) {

  const box =
    document.getElementById("progress");

  if (!box) return;


  status = normalizeStatus(status);


  /* CANCELLED */

  if (status === "cancelled") {

    box.className = "grid grid-cols-1 gap-2";

    box.innerHTML = `

      <div
        class="rounded-xl bg-red-50 text-red-700 border border-red-100 p-4 text-center text-sm font-bold"
      >

        <i class="fa-solid fa-circle-xmark mr-2"></i>

        This order has been cancelled.

      </div>

    `;

    return;

  }


  box.className =
    "grid grid-cols-5 gap-1";


  const active =
    STATUS_STEPS.findIndex(
      step => step.key === status
    );


  box.innerHTML =
    STATUS_STEPS.map((step, i) => {

      const done =
        i <= active;


      return `

        <div
          class="text-center ${
            done
              ? "text-[#004232]"
              : "text-gray-300"
          }"
        >

          <div
            class="h-2 rounded-full ${
              done
                ? "bg-[#004232]"
                : "bg-gray-200"
            }"
          ></div>


          <div
            class="mt-2 text-[8px] sm:text-[10px] font-bold leading-tight"
          >

            <i
              class="fa-solid ${step.icon} mr-1"
            ></i>

            ${step.label}

          </div>

        </div>

      `;

    }).join("");

}


/* ============================================================
   RENDER ORDER
============================================================ */

function renderOrder(result) {

  const order =
    result?.order;


  const items =
    result?.items || [];


  if (!order) {

    throw new Error(
      "Order data was not returned."
    );

  }


  const status =
    normalizeStatus(order.order_status);


  const meta =
    statusMeta(status);


  document
    .getElementById("orderCard")
    .classList.remove("hidden");


  document
    .getElementById("displayOrderRef")
    .textContent =
      "#" + (
        order.order_ref ||
        ""
      );


  const badge =
    document.getElementById(
      "statusBadge"
    );


  badge.className =
    "inline-flex self-start sm:self-auto items-center gap-2 px-3 py-2 rounded-full text-xs font-bold " +
    meta.cls;


  badge.innerHTML = `

    <i class="fa-solid fa-circle"></i>

    ${esc(meta.label)}

  `;


  document
    .getElementById("paymentText")
    .textContent =
      order.payment_method === "COD"
        ? "Cash on Delivery"
        : (
            order.payment_method ||
            "Paid Online"
          );


  document
    .getElementById("dateText")
    .textContent =
      order.created_at
        ? new Date(
            order.created_at
          ).toLocaleString(
            "en-SA"
          )
        : "-";


  document
    .getElementById("totalText")
    .textContent =
      "SAR " +
      Number(
        order.total_amount || 0
      ).toFixed(2);


  document
    .getElementById("customerName")
    .textContent =
      order.customer_name || "-";


  document
    .getElementById("customerPhone")
    .textContent =
      order.customer_phone || "-";


  document
    .getElementById("address")
    .textContent =
      order.shipping_address || "-";


  document
    .getElementById("city")
    .textContent =
      order.shipping_city || "-";


  document
    .getElementById("postal")
    .textContent =
      order.shipping_postal_code || "N/A";


  const itemsBox =
    document.getElementById(
      "items"
    );


  if (!items.length) {

    itemsBox.innerHTML = `

      <div
        class="rounded-xl bg-gray-50 p-4 text-sm text-gray-500"
      >
        No item details available.
      </div>

    `;

  } else {

    itemsBox.innerHTML =
      items.map(item => `

        <div
          class="flex justify-between gap-3 rounded-xl bg-gray-50 p-3 text-sm"
        >

          <div>

            <p class="font-bold">
              ${esc(
                item.product_name ||
                item.name ||
                "Product"
              )}
            </p>

            <p class="text-xs text-gray-500">

              Qty:
              ${Number(
                item.quantity || 0
              )}

              × SAR

              ${Number(
                item.unit_price || 0
              ).toFixed(2)}

            </p>

          </div>


          <p class="font-bold">

            SAR
            ${Number(
              item.line_total ||
              (
                Number(
                  item.quantity || 0
                ) *
                Number(
                  item.unit_price || 0
                )
              )
            ).toFixed(2)}

          </p>

        </div>

      `).join("");

  }


  renderProgress(status);

}


/* ============================================================
   TRACK ORDER USING RPC
============================================================ */

async function trackUsingRPC(
  orderRef,
  phone
) {

  const { data, error } =
    await db.rpc(
      "athaq_track_order",
      {
        p_order_ref:
          orderRef
            .trim()
            .toUpperCase(),

        p_phone:
          phone.trim()
      }
    );


  if (error) {

    console.error(
      "ATHAQ RPC ERROR:",
      error
    );

    throw error;

  }


  if (!data) {

    throw new Error(
      "No order found."
    );

  }


  /*
   * RPC may return JSON object
   */
  if (
    data.order
  ) {

    return data;

  }


  /*
   * Some RPC versions may return
   * an array.
   */

  if (
    Array.isArray(data) &&
    data.length
  ) {

    return {
      order:
        data[0],
      items:
        []
    };

  }


  throw new Error(
    "No order found. Please check your order reference and phone number."
  );

}


/* ============================================================
   FALLBACK DIRECT SEARCH
============================================================ */

async function trackUsingDirectQuery(
  orderRef,
  phone
) {

  console.warn(
    "Trying direct order lookup..."
  );


  const cleanRef =
    orderRef
      .trim()
      .toUpperCase();


  const cleanPhone =
    phone
      .trim();


  const { data, error } =
    await db
      .from("orders")
      .select(`
        id,
        order_ref,
        customer_name,
        customer_phone,
        customer_email,
        shipping_address,
        shipping_city,
        shipping_postal_code,
        payment_method,
        payment_status,
        order_status,
        subtotal,
        shipping_amount,
        total_amount,
        created_at,
        updated_at
      `)
      .eq(
        "order_ref",
        cleanRef
      )
      .limit(1);


  if (error) {

    console.error(
      "Direct order lookup error:",
      error
    );

    throw error;

  }


  if (!data || !data.length) {

    throw new Error(
      "No order found with this order reference."
    );

  }


  const order =
    data[0];


  /*
   * Normalize phone numbers
   * before comparing.
   */

  const normalizePhone =
    value =>
      String(value || "")
        .replace(/\D/g, "");


  const dbPhone =
    normalizePhone(
      order.customer_phone
    );


  const searchPhone =
    normalizePhone(
      cleanPhone
    );


  if (
    dbPhone &&
    searchPhone &&
    dbPhone !== searchPhone
  ) {

    throw new Error(
      "The phone number does not match this order."
    );

  }


  /*
   * Load order items.
   */

  let items = [];


  const itemsResponse =
    await db
      .from("order_items")
      .select("*")
      .eq(
        "order_id",
        order.id
      );


  if (
    !itemsResponse.error &&
    itemsResponse.data
  ) {

    items =
      itemsResponse.data;

  }


  return {
    order,
    items
  };

}


/* ============================================================
   MAIN SEARCH
============================================================ */

async function loadOrder(
  orderRef,
  phone
) {

  const errorBox =
    document.getElementById(
      "trackError"
    );


  const successBox =
    document.getElementById(
      "trackSuccess"
    );


  const btn =
    document.getElementById(
      "trackBtn"
    );


  errorBox.classList.add(
    "hidden"
  );


  successBox.classList.add(
    "hidden"
  );


  document
    .getElementById("orderCard")
    .classList.add("hidden");


  orderRef =
    String(
      orderRef || ""
    ).trim();


  phone =
    String(
      phone || ""
    ).trim();


  if (!orderRef) {

    errorBox.textContent =
      "Please enter your order reference.";

    errorBox.classList.remove(
      "hidden"
    );

    return;

  }


  if (!phone) {

    errorBox.textContent =
      "Please enter the phone number used at checkout.";

    errorBox.classList.remove(
      "hidden"
    );

    return;

  }


  btn.disabled = true;


  btn.innerHTML = `

    <i
      class="fa-solid fa-spinner fa-spin mr-2"
    ></i>

    Checking...

  `;


  try {

    /*
     * Make sure Supabase is available.
     */

    if (!db) {

      db =
        resolveSupabaseClient();

    }


    if (!db) {

      throw new Error(
        "Supabase connection is not available. Please check supabase-config.js."
      );

    }


    console.log(
      "ATHAQ Supabase connected successfully."
    );


    let result;


    /*
     * First use secure RPC.
     */

    try {

      result =
        await trackUsingRPC(
          orderRef,
          phone
        );

    } catch (rpcError) {

      console.warn(
        "RPC tracking failed:",
        rpcError
      );


      /*
       * If RPC is missing or unavailable,
       * try direct query.
       */

      result =
        await trackUsingDirectQuery(
          orderRef,
          phone
        );

    }


    if (
      !result ||
      !result.order
    ) {

      throw new Error(
        "No order found. Please check your order reference and phone number."
      );

    }


    renderOrder(
      result
    );


    /*
     * Save last tracked order.
     */

    localStorage.setItem(
      "athaqLastOrder",
      JSON.stringify({
        order_ref:
          result.order.order_ref,

        phone:
          phone
      })
    );


    successBox.innerHTML = `

      <i
        class="fa-solid fa-circle-check mr-2"
      ></i>

      Order found successfully.

    `;


    successBox.classList.remove(
      "hidden"
    );


    /*
     * Scroll order into view.
     */

    setTimeout(() => {

      document
        .getElementById(
          "orderCard"
        )
        ?.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

    }, 150);


  } catch (err) {

    console.error(
      "ATHAQ TRACK ERROR:",
      err
    );


    let message =
      err?.message ||
      "Unable to find this order.";


    /*
     * Friendly messages
     */

    if (
      message.includes(
        "Failed to fetch"
      )
    ) {

      message =
        "Supabase connection failed. Please check your Supabase URL and key.";

    }


    if (
      message.includes(
        "athaq_track_order"
      )
    ) {

      message =
        "Order tracking function is not available in Supabase. Please run the tracking SQL function.";

    }


    errorBox.innerHTML = `

      <div class="flex items-start gap-3">

        <i
          class="fa-solid fa-circle-exclamation mt-0.5"
        ></i>

        <div>

          <p class="font-bold">
            Unable to track order
          </p>

          <p class="mt-1">
            ${esc(message)}
          </p>

        </div>

      </div>

    `;


    errorBox.classList.remove(
      "hidden"
    );

  } finally {

    btn.disabled = false;


    btn.innerHTML = `

      <i
        class="fa-solid fa-magnifying-glass mr-2"
      ></i>

      Track Order

    `;

  }

}


/* ============================================================
   INITIALIZATION
============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    /*
     * Resolve Supabase immediately.
     */

    db =
      resolveSupabaseClient();


    console.log(
      "ATHAQ tracking Supabase:",
      db
    );


    const form =
      document.getElementById(
        "trackForm"
      );


    const orderRefInput =
      document.getElementById(
        "orderRef"
      );


    const phoneInput =
      document.getElementById(
        "phone"
      );


    /*
     * Get saved order.
     */

    let saved = null;


    try {

      saved =
        JSON.parse(
          localStorage.getItem(
            "athaqLastOrder"
          ) || "null"
        );

    } catch (e) {

      saved = null;

    }


    /*
     * Get URL parameters.
     *
     * Example:
     *
     * track.html?order=ATH-12345678&phone=+966501234567
     */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const urlOrder =
      params.get(
        "order"
      );


    const urlPhone =
      params.get(
        "phone"
      );


    /*
     * Fill fields.
     */

    orderRefInput.value =
      urlOrder ||
      saved?.order_ref ||
      "";


    phoneInput.value =
      urlPhone ||
      saved?.phone ||
      "";


    /*
     * Submit
     */

    form.addEventListener(
      "submit",
      event => {

        event.preventDefault();


        loadOrder(
          orderRefInput.value,
          phoneInput.value
        );

      }
    );


    /*
     * Auto search if URL contains
     * order + phone.
     */

    if (
      urlOrder &&
      urlPhone
    ) {

      loadOrder(
        urlOrder,
        urlPhone
      );

    }

  }
);

</script>
