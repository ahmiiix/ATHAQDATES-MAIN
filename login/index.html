<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATHAQ - Login & Register</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
</head>
<body class="bg-[#faf9f4] text-[#1b1c19] font-['Manrope',sans-serif] min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-sm border border-gray-100">
  <div class="text-center mb-6"><span style="display:block;font-family:'Playfair Display',serif;font-size:32px;font-weight:600;letter-spacing:3px;color:#004232;text-align:center;margin-bottom:5px;">ATHAQ DATES</span><p id="formSubtitle" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Sign in to your account</p></div>
  <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Username / Email</label><input type="text" id="loginInput" placeholder="touseefahmad or email" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label><input type="password" id="loginPassword" placeholder="••••••••" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div id="errorMsg" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2 rounded-lg"></div>
    <button type="submit" class="w-full bg-[#004232] text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-[#002e23] transition-all shadow-md mt-2">Login</button>
    <div class="text-center mt-4"><p class="text-xs text-gray-500">Don't have an account? <button type="button" onclick="toggleForm('register')" class="text-[#004232] font-bold hover:underline">Create Account</button></p></div>
  </form>
  <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name</label><input type="text" id="regName" placeholder="Your Name" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label><input type="email" id="regEmail" placeholder="you@example.com" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label><input type="password" id="regPassword" placeholder="••••••••" required minlength="6" class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div id="regErrorMsg" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2 rounded-lg"></div>
    <div id="verificationBox" class="hidden mt-3 p-4 rounded-xl bg-emerald-50 border border-emerald-100">

    <p class="text-xs text-gray-600 text-center mb-3">
        Registration successful. Please check your email and verify your account.
    </p>

    <button
        type="button"
        id="resendVerificationBtn"
        onclick="resendVerificationEmail()"
        class="w-full bg-[#004232] text-white py-3 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-[#002e23] transition-all"
    >
        Resend Verification Email
    </button>

    <p
        id="resendMessage"
        class="text-[11px] text-center mt-2 text-gray-500"
    ></p>

</div>
    <button type="submit" class="w-full bg-[#004232] text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-[#002e23] transition-all shadow-md mt-2">Register & Create Account</button>
    <div class="text-center mt-4"><p class="text-xs text-gray-500">Already have an account? <button type="button" onclick="toggleForm('login')" class="text-[#004232] font-bold hover:underline">Login here</button></p></div>
  </form>
  <div class="mt-6 text-center border-t border-gray-100 pt-4"><a href="../index.html" class="text-xs font-semibold text-gray-500 hover:text-[#004232] transition-colors">&larr; Back to Website</a></div>
</div>
<script>
const db = window.supabaseClient || window.ATHAQ_SUPABASE;
const ADMIN_EMAIL = "xshazam023@gmail.com";
function toggleForm(type){document.getElementById('loginForm').classList.toggle('hidden',type!=='login');document.getElementById('registerForm').classList.toggle('hidden',type!=='register');document.getElementById('formSubtitle').textContent=type==='login'?'Sign in to your account':'Create your account';}
function showError(id,msg){const e=document.getElementById(id);e.textContent=msg;e.classList.remove('hidden');}
async function handleLogin(event) {
    event.preventDefault();

    const input = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorBox = document.getElementById('errorMsg');

    errorBox.classList.add('hidden');

    if (!window.ATHAQ_SUPABASE) {
        showError('errorMsg', 'Supabase is not configured yet.');
        return;
    }

    if (!input || !password) {
        showError('errorMsg', 'Please enter username/email and password.');
        return;
    }

    let email = input;

    // =========================================
    // USERNAME LOGIN
    // =========================================
    if (!input.includes('@')) {

        const { data: usernameEmail, error: usernameError } =
            await window.ATHAQ_SUPABASE.rpc(
                'get_email_by_username',
                {
                    p_username: input
                }
            );

        console.log('Username:', input);
        console.log('Email found:', usernameEmail);
        console.log('Username error:', usernameError);

        if (usernameError) {
            console.error(usernameError);

            showError(
                'errorMsg',
                'Username login error. Please try again.'
            );

            return;
        }

        if (!usernameEmail) {
            showError(
                'errorMsg',
                'Invalid username/email or password!'
            );

            return;
        }

        email = usernameEmail;
    }

    // =========================================
    // EMAIL / USERNAME BOTH LOGIN THROUGH EMAIL
    // =========================================
    const { data, error } =
        await window.ATHAQ_SUPABASE.auth.signInWithPassword({
            email: email,
            password: password
        });

    console.log('Login email:', email);
    console.log('Login data:', data);
    console.log('Login error:', error);

    if (error) {
        showError(
            'errorMsg',
            'Invalid username/email or password!'
        );

        return;
    }

    if (!data || !data.user) {
        showError(
            'errorMsg',
            'Login failed. Please try again.'
        );

        return;
    }

    const user = data.user;

    // =========================================
    // EMAIL VERIFICATION CHECK
    // =========================================
    if (!user.email_confirmed_at) {

        await window.ATHAQ_SUPABASE.auth.signOut();

        showError(
            'errorMsg',
            'Please verify your email before logging in.'
        );

        return;
    }

    // =========================================
    // USER INFORMATION
    // =========================================
    const username =
        user.user_metadata?.username || '';

    const fullName =
        user.user_metadata?.full_name ||
        user.email;

    const isAdmin =
        user.email?.toLowerCase() ===
        'xshazam023@gmail.com';

    // =========================================
    // SAVE LOGIN SESSION
    // =========================================
    sessionStorage.setItem('isLoggedIn', 'true');
    sessionStorage.setItem(
        'userRole',
        isAdmin ? 'admin' : 'customer'
    );

    sessionStorage.setItem(
        'userName',
        isAdmin ? 'Admin' : fullName
    );

    sessionStorage.setItem(
        'userUsername',
        username
    );

    sessionStorage.setItem(
        'userEmail',
        user.email
    );

    const loggedUser = {
        name: isAdmin ? 'Admin' : fullName,
        username: username,
        email: user.email,
        role: isAdmin ? 'admin' : 'customer'
    };

    localStorage.setItem(
        'loggedInUser',
        JSON.stringify(loggedUser)
    );

    localStorage.setItem(
        'userRole',
        isAdmin ? 'admin' : 'customer'
    );

    localStorage.setItem(
        'user',
        JSON.stringify(loggedUser)
    );

    // =========================================
    // REDIRECT
    // =========================================
    if (isAdmin) {

        window.location.href =
            '../admin/index.html';

    } else {

        window.location.href =
            '../customer-profile/profile.html';
    }
}
async function handleRegister(event) {
    event.preventDefault();

    const errorBox = document.getElementById('regErrorMsg');
    const verificationBox = document.getElementById('verificationBox');
    const resendMessage = document.getElementById('resendMessage');
    const registerButton =
        document.querySelector('#registerForm button[type="submit"]');

    errorBox.classList.add('hidden');
    verificationBox.classList.add('hidden');
    resendMessage.textContent = '';

    if (!db) {
        showError(
            'regErrorMsg',
            'Supabase is not configured yet.'
        );
        return;
    }

    const name =
        document.getElementById('regName').value.trim();

    const email =
        document.getElementById('regEmail').value.trim().toLowerCase();

    const password =
        document.getElementById('regPassword').value;

    if (!name || !email || !password) {
        showError(
            'regErrorMsg',
            'Please fill all required fields.'
        );
        return;
    }

    if (password.length < 6) {
        showError(
            'regErrorMsg',
            'Password must be at least 6 characters.'
        );
        return;
    }

    registerButton.disabled = true;
    registerButton.textContent = 'Creating Account...';

    try {

        const { data, error } = await db.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: name
                }
            }
        });

        console.log('SUPABASE SIGNUP DATA:', data);
        console.log('SUPABASE SIGNUP ERROR:', error);

        /*
        ==========================================
        SUPABASE ERROR
        ==========================================
        */

        if (error) {

            console.error('Registration Error:', error);

            registerButton.disabled = false;
            registerButton.textContent =
                'Register & Create Account';

            showError(
                'regErrorMsg',
                error.message
            );

            return;
        }

        /*
        ==========================================
        USER WAS CREATED
        ==========================================
        */

        if (!data || !data.user) {

            registerButton.disabled = false;
            registerButton.textContent =
                'Register & Create Account';

            showError(
                'regErrorMsg',
                'Account could not be created. Please try again.'
            );

            return;
        }

        /*
        ==========================================
        EMAIL VERIFICATION REQUIRED
        ==========================================
        */

        if (!data.session) {

            sessionStorage.setItem(
                'verificationEmail',
                email
            );

            sessionStorage.setItem(
                'verificationName',
                name
            );

            verificationBox.classList.remove('hidden');

            registerButton.disabled = true;
            registerButton.textContent =
                'Verification Required';

            registerButton.classList.add(
                'opacity-50',
                'cursor-not-allowed'
            );

            resendMessage.textContent =
                `Verification email sent to ${email}. Please check your inbox.`;

            resendMessage.className =
                'text-[11px] text-center mt-2 text-green-700';

            startResendCooldown();

            return;
        }

        /*
        ==========================================
        EMAIL VERIFICATION NOT REQUIRED
        ==========================================
        */

        const customerUser = {
            name: name,
            email: email,
            role: 'customer'
        };

        sessionStorage.setItem(
            'isLoggedIn',
            'true'
        );

        sessionStorage.setItem(
            'userRole',
            'customer'
        );

        sessionStorage.setItem(
            'userName',
            name
        );

        sessionStorage.setItem(
            'userEmail',
            email
        );

        localStorage.setItem(
            'loggedInUser',
            JSON.stringify(customerUser)
        );

        localStorage.setItem(
            'userRole',
            'customer'
        );

        localStorage.setItem(
            'user',
            JSON.stringify(customerUser)
        );

        window.location.href =
            '../customer-profile/profile.html';

    } catch (err) {

        console.error(
            'Unexpected Registration Error:',
            err
        );

        registerButton.disabled = false;
        registerButton.textContent =
            'Register & Create Account';

        showError(
            'regErrorMsg',
            'Something went wrong. Please try again.'
        );
    }
}
async function resendVerificationEmail() {

    const button = document.getElementById('resendVerificationBtn');
    const message = document.getElementById('resendMessage');

    const email = sessionStorage.getItem('verificationEmail');

    if (!email) {
        message.textContent = 'Please register again first.';
        message.className =
            'text-[11px] text-center mt-2 text-red-600';
        return;
    }

    if (!db) {
        message.textContent = 'Supabase is not configured.';
        return;
    }

    // Button temporarily disable
    button.disabled = true;
    button.classList.add('opacity-50', 'cursor-not-allowed');

    message.textContent = 'Sending verification email...';
    message.className =
        'text-[11px] text-center mt-2 text-gray-500';

    const { error } = await db.auth.resend({
        type: 'signup',
        email: email
    });

    if (error) {

        console.error('Resend verification error:', error);

        message.textContent =
            'Email could not be sent. Please try again later.';

        message.className =
            'text-[11px] text-center mt-2 text-red-600';

        button.disabled = false;
        button.classList.remove('opacity-50', 'cursor-not-allowed');

        return;
    }

    message.textContent =
        'Verification email sent successfully. Please check your inbox.';

    message.className =
        'text-[11px] text-center mt-2 text-green-700';

    startResendCooldown();
}
function startResendCooldown() {

    const button = document.getElementById('resendVerificationBtn');
    const message = document.getElementById('resendMessage');

    let seconds = 60;

    button.disabled = true;
    button.classList.add('opacity-50', 'cursor-not-allowed');

    button.textContent = `Resend Verification (${seconds}s)`;

    const timer = setInterval(() => {

        seconds--;

        if (seconds <= 0) {

            clearInterval(timer);

            button.disabled = false;
            button.classList.remove(
                'opacity-50',
                'cursor-not-allowed'
            );

            button.textContent = 'Resend Verification Email';

            message.textContent =
                'You can request another verification email now.';

            return;
        }

        button.textContent =
            `Resend Verification (${seconds}s)`;

    }, 1000);
}
</script>
</body>
</html>
