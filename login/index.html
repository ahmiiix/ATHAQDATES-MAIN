<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATHAQ - Login & Register</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
</head>
<body class="bg-[#faf9f4] text-[#1b1c19] font-['Manrope',sans-serif] min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-sm border border-gray-100">
  <div class="text-center mb-6"><span style="display:block;font-family:'Playfair Display',serif;font-size:32px;font-weight:600;letter-spacing:3px;color:#004232;text-align:center;margin-bottom:5px;">ATHAQ DATES</span><p id="formSubtitle" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Sign in to your account</p></div>
  <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Username / Email</label><input type="text" id="loginInput" placeholder="touseefahmad or email" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label><input type="password" id="loginPassword" placeholder="••••••••" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div id="errorMsg" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2 rounded-lg"></div>
    <button type="submit" class="w-full bg-[#004232] text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-[#002e23] transition-all shadow-md mt-2">Login</button>
    <div class="text-center mt-4"><p class="text-xs text-gray-500">Don't have an account? <button type="button" onclick="toggleForm('register')" class="text-[#004232] font-bold hover:underline">Create Account</button></p></div>
  </form>
  <form id="registerForm" class="space-y-4 hidden" onsubmit="handleRegister(event)">
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name</label><input type="text" id="regName" placeholder="Your Name" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label><input type="email" id="regEmail" placeholder="you@example.com" required class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label><input type="password" id="regPassword" placeholder="••••••••" required minlength="6" class="w-full border border-gray-300 rounded-xl shadow-sm focus:ring-[#004232] focus:border-[#004232] text-sm py-3 px-4 outline-none"></div>
    <div id="regErrorMsg" class="hidden text-rose-600 text-xs font-bold text-center bg-rose-50 py-2 rounded-lg"></div>
    <button type="submit" class="w-full bg-[#004232] text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider hover:bg-[#002e23] transition-all shadow-md mt-2">Register & Create Account</button>
    <div class="text-center mt-4"><p class="text-xs text-gray-500">Already have an account? <button type="button" onclick="toggleForm('login')" class="text-[#004232] font-bold hover:underline">Login here</button></p></div>
  </form>
  <div class="mt-6 text-center border-t border-gray-100 pt-4"><a href="../index.html" class="text-xs font-semibold text-gray-500 hover:text-[#004232] transition-colors">&larr; Back to Website</a></div>
</div>
<script>
const db = window.ATHAQ_SUPABASE;
const ADMIN_EMAIL = "xshazam023@gmail.com";
function toggleForm(type){document.getElementById('loginForm').classList.toggle('hidden',type!=='login');document.getElementById('registerForm').classList.toggle('hidden',type!=='register');document.getElementById('formSubtitle').textContent=type==='login'?'Sign in to your account':'Create your account';}
function showError(id,msg){const e=document.getElementById(id);e.textContent=msg;e.classList.remove('hidden');}
async function handleLogin(event) {
    event.preventDefault();

    const input = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('loginPassword').value;

    document.getElementById('errorMsg').classList.add('hidden');

    if (!db) {
        showError('errorMsg', 'Supabase is not configured yet.');
        return;
    }

    const email = input.toLowerCase() === 'admin'
        ? ADMIN_EMAIL
        : input;

    const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        showError('errorMsg', 'Invalid username/email or password!');
        return;
    }

    const user = data.user;

    if (!user) {
        showError('errorMsg', 'Login failed. User not found.');
        return;
    }

    const isAdmin =
        user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();

    /* =========================
       ADMIN LOGIN
    ========================= */

    if (isAdmin) {

        const adminUser = {
            name: 'Admin',
            email: user.email,
            role: 'admin'
        };

        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('userRole', 'admin');
        sessionStorage.setItem('userName', 'Admin');
        sessionStorage.setItem('userEmail', user.email);

        localStorage.setItem(
            'loggedInUser',
            JSON.stringify(adminUser)
        );

        localStorage.setItem('userRole', 'admin');

        localStorage.setItem(
            'user',
            JSON.stringify(adminUser)
        );

        window.location.href = '../admin/index.html';

        return;
    }

    /* =========================
       CUSTOMER LOGIN
    ========================= */

    const customerUser = {
        name: user.user_metadata?.full_name || user.email,
        email: user.email,
        role: 'customer'
    };

    sessionStorage.setItem('isLoggedIn', 'true');
    sessionStorage.setItem('userRole', 'customer');
    sessionStorage.setItem(
        'userName',
        customerUser.name
    );
    sessionStorage.setItem(
        'userEmail',
        customerUser.email
    );

    localStorage.setItem(
        'loggedInUser',
        JSON.stringify(customerUser)
    );

    localStorage.setItem('userRole', 'customer');

    localStorage.setItem(
        'user',
        JSON.stringify(customerUser)
    );

    window.location.href = '../customer-profile/profile.html';
}
async function handleRegister(event){event.preventDefault();document.getElementById('regErrorMsg').classList.add('hidden');if(!db){showError('regErrorMsg','Supabase is not configured yet.');return;}const name=document.getElementById('regName').value.trim();const email=document.getElementById('regEmail').value.trim();const password=document.getElementById('regPassword').value;const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});if(error){showError('regErrorMsg',error.message);return;}if(data.session){sessionStorage.setItem('isLoggedIn','true');sessionStorage.setItem('userRole','customer');sessionStorage.setItem('userName',name);sessionStorage.setItem('userEmail',email);window.location.href='../customer-profile/profile.html';}else{showError('regErrorMsg','Registration successful. Check your email to confirm your account, then login.');}}
</script>
</body>
</html>
